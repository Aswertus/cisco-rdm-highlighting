name: Guard

# Server-side backstop: this repository may only ever contain the files listed in ALLOWED below
# (the same allow-list the private dev repo enforces before a release is pushed). Fails a PR or a
# push that adds anything else — a stray config, a dump, a submodule. Required check for main.
#
# pull_request_target (not pull_request): GitHub runs THIS file as it is on the base branch, so a PR
# cannot edit the check that judges it. Safe because PR content is only listed with git, never
# checked out or executed.
on:
  pull_request_target:
  push:

permissions:
  contents: read

jobs:
  guard:
    if: github.repository == 'Aswertus/cisco-rdm-highlighting'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The PR's commits, into a separate folder: only listed with git below, never executed. Done by
      # actions/checkout because a bare `git fetch` has no credentials (persist-credentials: false),
      # which fails on a private repo.
      - name: Fetch the PR head (read only)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Only allowed paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALLOWED: '^(README\.md|LICENSE|CHANGELOG\.md|(default|vscode)-background/[A-Za-z0-9._-]+\.(xml|txt)|media/[A-Za-z0-9._-]+\.png|\.github/workflows/(guard|release|lock-closed)\.yml|\.github/ISSUE_TEMPLATE/[A-Za-z0-9._-]+\.yml)$'
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request_target ]; then
            repo=pr
            head=$(git -C pr rev-parse --verify HEAD)
            git -C pr cat-file -e "$BASE_SHA^{commit}" # the base must be in the fetched history
            # every path any commit of the PR touches, not just the final tree
            paths=$( { git -C pr ls-tree -r --name-only "$head"; git -C pr log -m --format= --name-only --no-renames "$BASE_SHA..$head"; } | sed '/^$/d' | sort -u)
          else
            repo=.
            head=$GITHUB_SHA
            paths=$(git ls-tree -r --name-only "$head")
          fi
          [ -n "$paths" ] || { echo "::error::no paths found — refusing to pass an empty listing"; exit 1; }
          # Regular files only (no submodules, symlinks or executables) — in every commit of a PR,
          # since a rebase merge keeps each of them, not just the final tree.
          if [ "$EVENT" = pull_request_target ]; then
            commits=$(git -C pr rev-list "$BASE_SHA..$head")
          else
            commits=$head
          fi
          for c in $commits; do
            listing=$(git -C "$repo" ls-tree -r "$c") # a failed listing stops the job (set -e), never passes
            odd=$(grep -v '^100644 blob ' <<<"$listing" || true)
            if [ -n "$odd" ]; then
              echo "::error::only regular files are allowed (commit $c):"; sed 's/^/  /' <<<"$odd"; exit 1
            fi
          done
          bad=$(grep -vE "$ALLOWED" <<<"$paths" || true)
          if [ -n "$bad" ]; then
            echo "::error::paths outside the allow-list:"; sed 's/^/  /' <<<"$bad"; exit 1
          fi
          echo "guard: OK ($(grep -c . <<<"$paths") paths)"
